<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numa = parseInt(prompt("몇 단부터?"));
        let numb = parseInt(prompt("몇 단까지"));
        for(let k=numa; k<=numb; k++){
            document.write(k+"단 : ");
            for(let i=1; i<=9; i++){
                if(i%2==0){
                    document.write(k+ "X" + i + "=" + k*i + "  ");
                }
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
