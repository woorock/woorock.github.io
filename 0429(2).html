<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요금 계산기</title>
</head>
<body>
    <script>
        let age;
        age = parseInt(prompt('나이를 입력하세요'));
        if (age<20){
            document.write("청소년 요금입니다"); 
        } else{
            document.write("성인 요금입니다")
        }
    </script>
</html>
